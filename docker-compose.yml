services:
  db:
    image: postgres:16-alpine
    container_name: inpar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inpar_db
      POSTGRES_USER: inpar_user
      POSTGRES_PASSWORD: inpar_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inpar_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_NAME=inpar_db
      - DB_USER=inpar_user
      - DB_PASSWORD=inpar_pass
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=92.38.49.140,localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://92.38.49.140,https://92.38.49.140
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inpar_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: inpar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_files:/app/media
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_files:
