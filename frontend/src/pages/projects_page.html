{% extends "base.html" %}
{% block content %}

<style>
  /* ===== PROJECTS PAGE ===== */
  .proj-hero { position:relative; padding:clamp(5rem,10vw,8rem) 1.5rem 3rem; }
  .proj-hero-inner { max-width:1344px; margin:0 auto; }
  .proj-badge-row { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; opacity:0; transition:opacity 600ms cubic-bezier(0.25,1,0.5,1); }
  .proj-badge-row.in { opacity:1; }
  .proj-badge-line { height:1px; width:2rem; background:#B8A276; flex-shrink:0; }
  .proj-badge-text { color:#B8A276; font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; font-weight:300; }
  .proj-title-row { display:flex; flex-direction:column; gap:1.5rem; opacity:0; transition:opacity 600ms 100ms cubic-bezier(0.25,1,0.5,1); }
  .proj-title-row.in { opacity:1; }
  @media (min-width:1024px) { .proj-title-row { flex-direction:row; align-items:flex-end; justify-content:space-between; } }
  .proj-title { font-size:clamp(2rem,5vw,3rem); font-weight:300; letter-spacing:-.02em; color:#E8E9ED; line-height:1.1; }
  .proj-count { display:flex; align-items:center; gap:.75rem; flex-shrink:0; }
  .proj-count-num { font-size:clamp(1.75rem,4vw,2.5rem); font-weight:300; color:#B8A276; line-height:1; }
  .proj-count-label { color:#9BA1AB; font-size:.8rem; max-width:120px; line-height:1.5; font-weight:300; }

  /* Filters */
  .filters-wrap { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:3rem; opacity:0; transition:opacity 600ms 150ms ease; }
  .filters-wrap.in { opacity:1; }
  .filter-btn {
    padding:.45rem 1.25rem; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid #333842; color:#9BA1AB; background:transparent; cursor:pointer;
    transition:border-color 250ms,color 250ms,background 250ms;
  }
  .filter-btn:hover { border-color:rgba(59,130,246,0.5); color:#E8E9ED; }
  .filter-btn.active { border-color:#B8A276; color:#B8A276; background:rgba(184,162,118,0.05); }

  /* Grid */
  .projects-grid { max-width:1344px; margin:0 auto; padding:0 1.5rem 5rem; }
  .proj-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr)); gap:1.5rem; }

  /* Card */
  .proj-card {
    position:relative; display:flex; flex-direction:column;
    border:1px solid #333842;
    background:linear-gradient(135deg,rgba(26,29,35,0.6),rgba(37,41,50,0.3));
    overflow:hidden;
    transition:border-color 500ms ease, opacity 500ms ease, transform 500ms ease;
    opacity:0; transform:translateY(32px);
  }
  .proj-card.visible { opacity:1; transform:translateY(0); }
  .proj-card.hidden-card { display:none; }
  .proj-card:hover { border-color:rgba(184,162,118,0.4); }
  .proj-card-corner {
    position:absolute; top:0; right:0; width:4rem; height:4rem;
    border-top:1px solid transparent; border-right:1px solid transparent;
    transition:border-color 500ms; pointer-events:none; z-index:1;
  }
  .proj-card:hover .proj-card-corner { border-color:rgba(184,162,118,0.3); }

  /* Card image */
  .proj-card-img { position:relative; height:13rem; overflow:hidden; flex-shrink:0; }
  .proj-card-img img {
    width:100%; height:100%; object-fit:cover;
    opacity:.6; transition:opacity 700ms ease, transform 700ms ease;
  }
  .proj-card:hover .proj-card-img img { opacity:.8; transform:scale(1.05); }
  .proj-card-img-overlay {
    position:absolute; inset:0;
    background:linear-gradient(to top,#1A1D23 0%,rgba(26,29,35,0.3) 50%,transparent 100%);
    pointer-events:none;
  }
  .proj-card-loc {
    position:absolute; top:1rem; left:1rem;
    display:inline-flex; align-items:center;
    padding:.25rem .75rem;
    background:rgba(26,29,35,0.8); border:1px solid #333842;
    color:#A8ADB5; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .proj-card-area {
    position:absolute; top:1rem; right:1rem;
    display:inline-flex; align-items:center;
    padding:.25rem .75rem;
    background:rgba(184,162,118,0.15); border:1px solid rgba(184,162,118,0.3);
    color:#B8A276; font-size:.7rem;
  }

  /* Card body */
  .proj-card-body { display:flex; flex-direction:column; flex:1; padding:1.5rem; }
  .proj-card-name {
    font-size:1rem; font-weight:300; letter-spacing:-.01em;
    color:#E8E9ED; margin-bottom:1rem; line-height:1.45;
    transition:color 300ms;
  }
  .proj-card:hover .proj-card-name { color:#fff; }
  .proj-card-systems { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:auto; }
  .sys-tag {
    display:inline-flex; align-items:center; gap:.4rem;
    padding:.25rem .625rem;
    border:1px solid #333842; background:rgba(37,41,50,0.6);
  }
  .sys-tag svg { width:12px; height:12px; flex-shrink:0; }
  .sys-tag span { font-size:.7rem; color:#9BA1AB; font-weight:300; }

  /* Empty */
  .proj-empty {
    grid-column:1/-1;
    display:flex; flex-direction:column; align-items:center;
    padding:6rem 2rem; color:#9BA1AB; text-align:center;
  }
  .proj-empty svg { width:48px; height:48px; color:#333842; margin-bottom:1.25rem; }
  .proj-empty p { font-size:1.1rem; font-weight:300; }

  /* Scroll reveal */
  .sa-header { opacity:0; transition:opacity 600ms cubic-bezier(0.25,1,0.5,1); }
  .sa-header.in { opacity:1; }

  @media (max-width:640px) {
    .filter-btn { padding:.4rem .875rem; font-size:.72rem; }
  }
</style>

<!-- SECTION HEADER -->
<section class="proj-hero">
  <div class="proj-hero-inner">
    <div class="proj-badge-row sa-header">
      <div class="proj-badge-line"></div>
      <span class="proj-badge-text" data-i18n="projects.badge">Реализованные проекты</span>
    </div>
    <div class="proj-title-row sa-header" style="transition-delay:100ms">
      <h1 class="proj-title" data-i18n="projects.title">Проекты</h1>
      <div class="proj-count">
        <span class="proj-count-num">25+</span>
        <span class="proj-count-label" data-i18n="projects.countLabel">реализованных объектов по всему миру</span>
      </div>
    </div>
  </div>
</section>

<!-- FILTERS -->
<div class="projects-grid">
  <div class="filters-wrap sa-header" id="filters" style="transition-delay:200ms">
    <button class="filter-btn active" data-filter="all" data-i18n="projects.filters.all">Все</button>
    <button class="filter-btn" data-filter="hotel" data-i18n="projects.filters.hotel">Отели</button>
    <button class="filter-btn" data-filter="mall" data-i18n="projects.filters.mall">Торговые центры</button>
    <button class="filter-btn" data-filter="office" data-i18n="projects.filters.office">Офисы</button>
    <button class="filter-btn" data-filter="residential" data-i18n="projects.filters.residential">Жилые</button>
    <button class="filter-btn" data-filter="public" data-i18n="projects.filters.public">Общественные</button>
  </div>

  <!-- GRID -->
  <div class="proj-grid" id="proj-grid">
    <!-- Cards rendered by JS -->
  </div>
</div>

  /* =========================================================
     STATE & LOCALE
  ========================================================= */
  let lang = localStorage.getItem('user-locale') || 'ru';
  let activeFilter = 'all';

  function t(key) { return T[lang][key] || key; }

  /* =========================================================
     RENDER
  ========================================================= */
  function renderI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      const v = T[lang][k];
      if (v) el.textContent = v;
    });
  }

  function renderFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const key = btn.dataset.filter;
      btn.textContent = t('filters.' + key);
      btn.classList.toggle('active', key === activeFilter);
    });
  }

  function sysTagHtml(key) {
    const s = SYSTEMS[key];
    if (!s) return '';
    return `<div class="sys-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="${s.color}" stroke-width="2">${s.svg}</svg>
      <span>${t('systems.' + key)}</span>
    </div>`;
  }

  function renderGrid() {
    const grid = document.getElementById('proj-grid');
    const list = activeFilter === 'all' ? projects : projects.filter(p => p.type === activeFilter);

    if (!list.length) {
      grid.innerHTML = `<div class="proj-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/></svg>
        <p>${t('empty')}</p>
      </div>`;
      return;
    }

    grid.innerHTML = list.map((p, i) => {
      const locKey = LOC_KEY[p.loc] || p.loc;
      const locLabel = t('cities.' + locKey);
      const areaTag = p.area ? `<div class="proj-card-area">${p.area}</div>` : '';
      const sysTags = p.systems.map(s => sysTagHtml(s)).join('');

      return `<article class="proj-card" data-id="${p.id}" style="transition-delay:${(i % 9) * 50}ms">
        <div class="proj-card-corner"></div>
        <div class="proj-card-img">
          <img src="${p.img}" alt="${p.name}" width="800" height="450" loading="lazy">
          <div class="proj-card-img-overlay"></div>
          <div class="proj-card-loc">${locLabel}</div>
          ${areaTag}
        </div>
        <div class="proj-card-body">
          <h3 class="proj-card-name">${p.name}</h3>
          <div class="proj-card-systems">${sysTags}</div>
        </div>
      </article>`;
    }).join('');

    // Animate in
    requestAnimationFrame(() => {
      grid.querySelectorAll('.proj-card').forEach((card, i) => {
        setTimeout(() => card.classList.add('visible'), (i % 9) * 50);
      });
    });
  }

  /* =========================================================
     FILTER CLICK
  ========================================================= */
  document.getElementById('filters').addEventListener('click', function(e) {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    renderFilters();
    // Fade out → re-render → fade in
    const grid = document.getElementById('proj-grid');
    grid.style.opacity = '0';
    grid.style.transition = 'opacity 200ms ease';
    setTimeout(() => {
      renderGrid();
      grid.style.opacity = '';
      grid.style.transition = '';
    }, 200);
  });

  /* =========================================================
     LOCALE SYNC
  ========================================================= */
  const _orig = window.setLocale;
  window.setLocale = function(l) {
    lang = l;
    if (_orig) _orig(l);
    renderI18n();
    renderFilters();
    renderGrid();
  };

  /* =========================================================
     SCROLL REVEAL
  ========================================================= */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.05 });
  document.querySelectorAll('.sa-header').forEach(el => io.observe(el));

  /* =========================================================
     INIT
  ========================================================= */
  lang = localStorage.getItem('user-locale') || 'ru';
  renderI18n();
  renderFilters();
  renderGrid();

})();
</script>
